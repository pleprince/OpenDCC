[workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]
channel-priority = "strict"

# The tools environment only. It stays small on purpose: every build gets its own environment
# derived from VERSIONS.md (or from the OpenUSD build it links), see tools/build/opendcc_build.
[dependencies]
python = "3.12.*"
cmake = "4.5.*"
ninja = "1.13.*"

[tasks]
# `pixi run <task> -- <args>`, e.g. `pixi run plan -- --release 25.11` or, resolved against a
# VFX Reference Platform year, `pixi run plan -- --release 25.11 CY2025`
bootstrap = "python tools/build/opendcc-build bootstrap"
probe = "python tools/build/opendcc-build probe"
plan = "python tools/build/opendcc-build plan"
deps = "python tools/build/opendcc-build deps"
usd = "python tools/build/opendcc-build usd"
configure = "python tools/build/opendcc-build configure"
build = "python tools/build/opendcc-build build"
install = "python tools/build/opendcc-build install"
test = "python tools/build/opendcc-build test"
all = "python tools/build/opendcc-build all"
clean = "python tools/build/opendcc-build clean"
